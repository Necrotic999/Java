<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Керування музеєм</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 th:text="${museum.id == null ? '➕ Додати новий музей' : '✏️ Редагувати музей'}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/museums/save}" th:object="${museum}" method="post">
                        <!-- Приховане поле для ID (потрібне для редагування) -->
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Назва музею</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Наприклад: Лувр" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label fw-bold">Місто</label>
                                <input type="text" th:field="*{city}" class="form-control" placeholder="Париж">
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold">Країна</label>
                                <input type="text" th:field="*{country}" class="form-control" placeholder="Франція">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Рік заснування</label>
                            <input type="number" th:field="*{yearFounded}" class="form-control" placeholder="1793">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Опис</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Короткий опис музею..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/museums}" class="btn btn-secondary">🔙 Назад до списку</a>
                            <button type="submit" class="btn btn-primary">Зберегти дані</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
