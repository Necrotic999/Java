<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Музеї Світу</title>
    <!-- Підключаємо Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary">🏛️ База даних музеїв світу</h2>
            <a th:href="@{/museums/new}" class="btn btn-success">Додати новий музей</a>
        </div>

        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th>Назва</th>
                <th>Місто</th>
                <th>Країна</th>
                <th>Рік заснування</th>
                <th class="text-center">Дії</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${museums}">
                <td th:text="${m.name}" class="fw-bold"></td>
                <td th:text="${m.city}"></td>
                <td th:text="${m.country}"></td>
                <td th:text="${m.yearFounded}"></td>
                <td class="text-center">
                    <a th:href="@{/museums/edit/{id}(id=${m.id})}" class="btn btn-sm btn-outline-warning">Редагувати</a>
                    <a th:href="@{/museums/delete/{id}(id=${m.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Ви впевнені, що хочете видалити цей музей?')">Видалити</a>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${museums.empty}" class="alert alert-info text-center">
            У базі поки немає жодного музею. Натисніть "Додати", щоб почати.
        </div>
    </div>
</div>
</body>
</html>
